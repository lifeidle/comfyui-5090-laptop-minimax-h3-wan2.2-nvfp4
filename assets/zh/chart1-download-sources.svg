<text x="24" y="308" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b">注意下方 7 倍与 12 倍的差距 —— 多源下载器不是可选项。</text>
