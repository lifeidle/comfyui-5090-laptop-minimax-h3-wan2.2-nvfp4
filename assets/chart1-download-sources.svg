<line x1="24.0" y1="274.0" x2="896.0" y2="274.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="24" y="292" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#0f172a" font-weight="600">modelscope is the primary source. hf-mirror and huggingface exist only as fallbacks.</text>
<text x="24" y="308" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#64748b">Note the 7x and 12x penalties below it - a multi-source downloader is not optional.</text>
